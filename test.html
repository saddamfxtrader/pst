<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PEPE Trader - Decimal & Logic Tests</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #0a0f1e; color: #e6ecf7; padding: 20px; line-height: 1.6; }
        h1, h2 { color: #22d3ee; }
        .test-container { background-color: #121a2e; border: 1px solid #1f2a44; border-radius: 18px; padding: 20px; margin-bottom: 20px; }
        .test-case { border-bottom: 1px solid #1f2a44; padding: 10px 0; }
        .test-case:last-child { border-bottom: none; }
        .test-name { font-weight: bold; color: #8ba0c2; }
        .test-result { padding: 4px 8px; border-radius: 5px; font-family: monospace; font-size: 14px; font-weight: bold; }
        .result-pass { background-color: #123a24; color: #4ade80; }
        .result-fail { background-color: #3a1a1a; color: #fca5a5; }
        pre { background-color: #0d1626; padding: 10px; border-radius: 8px; white-space: pre-wrap; word-wrap: break-word; font-size: 13px; }
        #summary { font-size: 1.2em; font-weight: bold; padding: 15px; border-radius: 10px; margin-bottom: 20px; text-align: center;}
    </style>
</head>
<body>
    <h1>PEPE Trader Test Suite</h1>
    <div id="summary">Loading...</div>
    <div id="results"></div>

<script>
// Extracting the necessary functions from index.html for testing
const D = {
  mul(a,b){ const A=dp(a),B=dp(b); return fmtScaled(BigInt(A.i+A.f)*BigInt(B.i+B.f), A.d+B.d); },
  div(a,b,dp_=18){
    const A=dp(a),B=dp(b);
    if(B.i==='0'&&!B.f || D.isZero(b)) return '0';
    const num=BigInt(A.i+A.f)*(10n**BigInt(B.d+dp_));
    const den=BigInt(B.i+B.f)*(10n**BigInt(A.d));
    if(den === 0n) return '0';
    return fmtScaled(num/den, dp_);
  },
  add(a,b){
    const A=dp(a),B=dp(b); const dpv=Math.max(A.d,B.d);
    return fmtScaled(BigInt(A.i+A.f)*(10n**BigInt(dpv-A.d))+BigInt(B.i+B.f)*(10n**BigInt(dpv-B.d)), dpv);
  },
  sub(a,b){ return D.add(a,D.neg(b)); },
  neg(a){ if(!a||a==='0'||a==='-0'||D.isZero(a)) return '0'; return String(a).startsWith('-')?String(a).slice(1):'-'+a; },
  cmp(a,b){
    const A=dp(a),B=dp(b); const dpv=Math.max(A.d,B.d,0);
    const ia=BigInt(A.i+A.f)*(10n**BigInt(dpv-A.d));
    const ib=BigInt(B.i+B.f)*(10n**BigInt(dpv-B.d));
    return ia<ib?-1:ia>ib?1:0;
  },
  gt(a,b){return D.cmp(a,b)>0;},
  lt(a,b){return D.cmp(a,b)<0;},
  gte(a,b){return D.cmp(a,b)>=0;},
  isZero(a){ try { return D.cmp(String(a), '0') === 0; } catch(e) { return false; } }
};
function dp(s){
  s=String(s==null?'0':s).trim();
  if(s===''||s==='.') s='0';
  let neg=false;
  if(s.startsWith('-')){neg=true;s=s.slice(1);}
  if(!/^\d*\.?\d*$/.test(s)){ 
    const n = Number(s);
    if (isFinite(n)) {
      s=n.toFixed(18);
    } else {
      s='0';
    }
  }
  let [i,f='']=s.split('.');
  i=i||'0'; f=f.replace(/0+$/,'');
  return {i:(neg?'-':'')+i, f, d:f.length};
}
function fmtScaled(big, scale){
  let neg=false;
  if(big<0n){neg=true;big=-big;}
  let s=big.toString();
  if(scale===0) return (neg?'-':'')+s;
  while(s.length<=scale) s='0'+s;
  let i=s.slice(0,s.length-scale);
  let f=s.slice(s.length-scale).replace(/0+$/,'');
  let out=(neg?'-':'')+i+(f?'.'+f:'');
  return out==='-0'?'0':out;
}
function ceilPrice(val){
  const s = String(val);
  const parts = s.split('.');
  if (parts.length === 1) return s;
  const decimals = parts[1].length;
  if (decimals <= 9) return s;
  const factor = '1' + '0'.repeat(decimals - 9);
  const scaled = D.mul(s, factor);
  const intScaled = Math.ceil(Number(scaled));
  return D.div(String(intScaled), factor, 9);
}
function floorQty(val){
  const s = String(val);
  const parts = s.split('.');
  if (parts.length === 1) return s;
  const decimals = parts[1].length;
  if (decimals <= 8) return s;
  const factor = '1' + '0'.repeat(decimals - 8);
  const scaled = D.mul(s, factor);
  const intScaled = Math.floor(Number(scaled));
  return D.div(String(intScaled), factor, 8);
}
function roundPrice(val){
  return D.div(val, '1', 9);
}


const tests = [
    // Issue B: Decimal Division
    { name: 'D.div(1, 0) = 0', fn: () => D.div('1', '0'), expected: '0' },
    { name: 'D.div(1, -0) = 0', fn: () => D.div('1', '-0'), expected: '0' },
    { name: 'D.div(1, 0.000) = 0', fn: () => D.div('1', '0.000'), expected: '0' },
    { name: 'D.div(0, -0.1) = 0', fn: () => D.div('0', '-0.1'), expected: '0' },

    // Issue C: Rounding
    { name: 'roundPrice(0.0000034411)', fn: () => roundPrice('0.0000034411'), expected: '0.000003441' },
    { name: 'roundPrice(1.2345678901)', fn: () => roundPrice('1.2345678901'), expected: '1.23456789' },
    { name: 'ceilPrice(0.0000034411)', fn: () => ceilPrice('0.0000034411'), expected: '0.000003442' },
    { name: 'ceilPrice(1.2345678901)', fn: () => ceilPrice('1.2345678901'), expected: '1.234567891' },
    { name: 'floorQty(123.456789012)', fn: () => floorQty('123.456789012'), expected: '123.45678901' },
    { name: 'floorQty(123.456789', fn: () => floorQty('123.45678901'), expected: '123.45678901' },

    // Issue E: Sell Fee Calculation
    { 
        name: 'Fee 0.1% target calculation',
        fn: () => {
            const totalBuyCost = '5';
            const targetPct = '1';
            const feePct = '0.1';
            const remainingQty = '1000000';
            const targetReturnTotal = D.mul(totalBuyCost, D.add('1', D.div(targetPct,'100',18)));
            const keepAfterSellFee = D.sub('1', D.div(feePct,'100',18));
            const denom = D.mul(remainingQty, keepAfterSellFee);
            const sellTargetRaw = D.div(targetReturnTotal, denom, 18);
            return ceilPrice(sellTargetRaw);
        },
        expected: '0.000005006' // (5 * 1.01) / (1000000 * 0.999) = 5.05 / 999000 = 0.00000505505... -> ceil -> 0.000005056
    },
    { 
        name: 'Fee 0% target calculation',
        fn: () => {
            const totalBuyCost = '5';
            const targetPct = '1';
            const feePct = '0';
            const remainingQty = '1000000';
            const targetReturnTotal = D.mul(totalBuyCost, D.add('1', D.div(targetPct,'100',18)));
            const keepAfterSellFee = D.sub('1', D.div(feePct,'100',18));
            const denom = D.mul(remainingQty, keepAfterSellFee);
            const sellTargetRaw = D.div(targetReturnTotal, denom, 18);
            return ceilPrice(sellTargetRaw);
        },
        expected: '0.00000505'
    },
];

const resultsEl = document.getElementById('results');
let passed = 0;
let failed = 0;

tests.forEach(test => {
    const testCaseEl = document.createElement('div');
    testCaseEl.className = 'test-case';
    const nameEl = document.createElement('div');
    nameEl.className = 'test-name';
    nameEl.textContent = test.name;
    testCaseEl.appendChild(nameEl);

    const resultEl = document.createElement('pre');
    try {
        const actual = test.fn();
        if (actual === test.expected) {
            resultEl.innerHTML = `<span class="test-result result-pass">PASS</span>`;
            passed++;
        } else {
            resultEl.innerHTML = `<span class="test-result result-fail">FAIL</span>\nExpected: ${test.expected}\nActual:   ${actual}`;
            failed++;
        }
    } catch (e) {
        resultEl.innerHTML = `<span class="test-result result-fail">ERROR</span>\n${e.message}`;
        failed++;
    }
    testCaseEl.appendChild(resultEl);
    resultsEl.appendChild(testCaseEl);
});

const summaryEl = document.getElementById('summary');
summaryEl.textContent = `${passed} Passed, ${failed} Failed`;
if (failed > 0) {
    summaryEl.style.backgroundColor = '#3a1a1a';
    summaryEl.style.color = '#fca5a5';
} else {
    summaryEl.style.backgroundColor = '#123a24';
    summaryEl.style.color = '#4ade80';
}
</script>
</body>
</html>
